services:

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s

  app:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2
    # Optionally override with .env (e.g. to use a cloud provider instead of Ollama)
    env_file:
      - path: .env
        required: false

volumes:
  ollama_models:
