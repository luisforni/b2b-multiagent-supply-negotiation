services:

  # ── Optional: only needed when Ollama is NOT already running on the host ──
  # Usage: docker compose --profile with-ollama up
  ollama:
    image: ollama/ollama:latest
    profiles: [with-ollama]
    ports:
      - "11435:11434"           # 11435 on host to avoid conflict with local Ollama
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ── Main application ──────────────────────────────────────────────────────
  app:
    build: .
    # Allows the container to reach the host's Ollama (Linux needs host-gateway)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PROVIDER: ollama
      # Default: connects to Ollama already running on the host
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2
    # Optional .env overrides (e.g. PROVIDER=openai + API keys)
    env_file:
      - path: .env
        required: false

volumes:
  ollama_models:
